# turnserver.conf — Coturn TURN Server configuration
#
# Place this file at:
#   /config/turnserver.conf
#
# Then restart the Coturn add-on/service.
#
# This configuration is optimized for:
# - Home Assistant
# - WebRTC TURN relay
# - TLS security
# - NAT/public IP setups
# - Reduced abuse surface

# ── Listening ────────────────────────────────────────────────────────────────

# TURN/STUN listening port (TCP + UDP)
listening-port=3478

# TLS/DTLS listening port
tls-listening-port=5349

# Relay (media) UDP port range
# Open these UDP ports in your router/firewall
min-port=49152
max-port=49300

# ── Identity ─────────────────────────────────────────────────────────────────

# Realm/domain name
realm=domain.example.com

# Use long-term credentials mechanism
# Required for authenticated TURN
lt-cred-mech

# TURN username/password
# Format:
# user=username:password
user=homeassistant:changeme

# ── IP addresses ─────────────────────────────────────────────────────────────

# Public external IP address of your router/VPS
# Required when Coturn is behind NAT
external-ip=101.102.103.104

# Optional:
# If multiple local interfaces exist, specify internal IP
# listening-ip=192.168.1.2

# ── Security ─────────────────────────────────────────────────────────────────

# Add STUN/TURN fingerprints
fingerprint

# Protect against replay attacks
stale-nonce

# Disable multicast peers
no-multicast-peers

# Optional:
# Disable TCP relay entirely
# Recommended for most WebRTC-only setups
# Uncomment if all clients work normally over UDP
#
no-tcp-relay

# ── TLS Certificates ─────────────────────────────────────────────────────────

# TLS certificate and private key
# Managed by Nginx Proxy Manager / Let's Encrypt

cert=/ssl/coturn/fullchain.pem
pkey=/ssl/coturn/privkey.pem

# ── Logging ──────────────────────────────────────────────────────────────────

# Log to stdout (recommended for Home Assistant add-on)
log-file=stdout

# Enable only for troubleshooting
# verbose

# ── Sessions ─────────────────────────────────────────────────────────────────

total-quota=40
user-quota=10

# ── Notes ────────────────────────────────────────────────────────────────────
#
# Recommended router/firewall ports:
#
# 3478/tcp
# 3478/udp
# 5349/tcp
# 49152-49300/udp
#
# After editing:
# Restart Coturn service/add-on.
#
# Verify using:
# - Trickle ICE
# - WebRTC diagnostics
#
# Successful setup should show:
# - relay candidates
# - your public IP
# - successful TURN allocations
#
